# =============================================================================
# ExternalSecret - Sincroniza credenciais do RDS do Secrets Manager para K8s
#
# O External Secrets Operator:
#   1. Lê o secret do AWS Secrets Manager
#   2. Cria um K8s Secret com os dados
#   3. Mantém sincronizado (refresh a cada 1h)
#   4. Pods consomem o K8s Secret normalmente
#
# Vantagem: secrets nunca ficam no Git ou no Terraform state
# =============================================================================
---
# Dev
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-app-db-credentials
  namespace: dev
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: demo-app-db-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: 'postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}'
        DB_HOST: '{{ .host }}'
        DB_PORT: '{{ .port }}'
        DB_NAME: '{{ .dbname }}'
        DB_USER: '{{ .username }}'
        DB_PASSWORD: '{{ .password }}'

  data:
    - secretKey: username
      remoteRef:
        key: eks-gitops-dev/dev/rds-master-password
        property: username
    - secretKey: password
      remoteRef:
        key: eks-gitops-dev/dev/rds-master-password
        property: password
    - secretKey: host
      remoteRef:
        key: eks-gitops-dev/dev/rds-master-password
        property: host
    - secretKey: port
      remoteRef:
        key: eks-gitops-dev/dev/rds-master-password
        property: port
    - secretKey: dbname
      remoteRef:
        key: eks-gitops-dev/dev/rds-master-password
        property: dbname
---
