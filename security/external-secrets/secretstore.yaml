# =============================================================================
# ClusterSecretStore - AWS Secrets Manager
# Permite que ExternalSecrets de QUALQUER namespace acessem o Secrets Manager
# A autenticação usa IRSA (IAM Role for Service Account)
#
# Pré-requisitos:
#   1. External Secrets Operator instalado (helm install)
#   2. IAM role com policy para secretsmanager:GetSecretValue
#   3. ServiceAccount com annotation eks.amazonaws.com/role-arn
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
