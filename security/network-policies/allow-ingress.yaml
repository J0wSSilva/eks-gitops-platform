# =============================================================================
# Network Policy - Allow Ingress Traffic
# Permite tráfego HTTP/HTTPS do Ingress Controller para os pods do app
# E permite tráfego de saída para endpoints necessários (AWS APIs, RDS)
#
# Egress HTTPS restrito: bloqueia metadata endpoint e redes não-roteáveis.
# Ajuste o VPC CIDR (10.0.0.0/8) conforme seu ambiente real.
# =============================================================================
---
# Dev
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-traffic
  namespace: dev
  labels:
    app.kubernetes.io/part-of: eks-gitops-platform
    policy-type: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Tráfego do ALB Ingress Controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8000
    # Tráfego do Prometheus (scrape metrics)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # HTTPS para AWS APIs (Secrets Manager, S3, ECR, etc.)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32 # EC2 metadata endpoint
              - 10.0.0.0/8         # Handled by RDS rule below
              - 192.168.0.0/16     # Private ranges
              - 172.16.0.0/12      # Private ranges
      ports:
        - protocol: TCP
          port: 443
    # PostgreSQL (RDS) — restrito ao VPC CIDR
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
---
