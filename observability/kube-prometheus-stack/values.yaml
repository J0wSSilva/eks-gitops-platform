# =============================================================================
# kube-prometheus-stack Helm Values
# Chart: prometheus-community/kube-prometheus-stack ~> 58.x
# Deploy via ArgoCD Application targeting this values file
# =============================================================================

# -- Global settings
fullnameOverride: 'monitoring'
namespaceOverride: 'monitoring'

# =============================================================================
# PROMETHEUS
# =============================================================================
prometheus:
  enabled: true

  prometheusSpec:
    # -- Retention
    retention: 15d
    retentionSize: '45GB'

    # -- Resources (adjust per environment)
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: '2'
        memory: 4Gi

    # -- Storage (EBS via gp3 StorageClass)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ['ReadWriteOnce']
          resources:
            requests:
              storage: 50Gi

    # -- Service discovery: scrape all ServiceMonitors/PodMonitors in all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # -- External labels for multi-cluster identification
    externalLabels:
      cluster: eks-gitops-platform
      environment: '{{ .Values.global.environment | default "dev" }}'

    # -- Scrape interval
    scrapeInterval: '30s'
    evaluationInterval: '30s'

    # -- Security context
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534

    # -- Topology spread for HA (prod)
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus

  # -- ServiceMonitor for Prometheus itself
  serviceMonitor:
    selfMonitor: true

# =============================================================================
# ALERTMANAGER
# =============================================================================
alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ['ReadWriteOnce']
          resources:
            requests:
              storage: 5Gi

  # -- Alertmanager configuration
  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/slack-webhook-url

    route:
      receiver: 'slack-warnings'
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      routes:
        # Critical → immediate
        - receiver: 'slack-critical'
          matchers:
            - severity = critical
          group_wait: 10s
          repeat_interval: 1h
          continue: true

        # PagerDuty for critical in prod
        - receiver: 'pagerduty-prod'
          matchers:
            - severity = critical
            - environment = prod
          group_wait: 0s
          repeat_interval: 5m

        # Warnings → slower cadence
        - receiver: 'slack-warnings'
          matchers:
            - severity = warning
          repeat_interval: 12h

    receivers:
      - name: 'slack-critical'
        slack_configs:
          - channel: '#alerts-critical'
            send_resolved: true
            title: '{{ "{{" }} .Status | toUpper {{ "}}" }} | {{ "{{" }} .CommonLabels.alertname {{ "}}" }}'
            text: >-
              *Cluster:* eks-gitops-platform
              *Namespace:* {{ "{{" }} .CommonLabels.namespace {{ "}}" }}
              *Description:* {{ "{{" }} .CommonAnnotations.description {{ "}}" }}
              *Runbook:* {{ "{{" }} .CommonAnnotations.runbook_url {{ "}}" }}

      - name: 'slack-warnings'
        slack_configs:
          - channel: '#alerts-warnings'
            send_resolved: true
            title: '{{ "{{" }} .Status | toUpper {{ "}}" }} | {{ "{{" }} .CommonLabels.alertname {{ "}}" }}'
            text: >-
              *Cluster:* eks-gitops-platform
              *Severity:* {{ "{{" }} .CommonLabels.severity {{ "}}" }}
              *Description:* {{ "{{" }} .CommonAnnotations.description {{ "}}" }}

      - name: 'pagerduty-prod'
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/pagerduty-routing-key
            severity: '{{ "{{" }} .CommonLabels.severity {{ "}}" }}'
            description: '{{ "{{" }} .CommonAnnotations.description {{ "}}" }}'

    # -- Inhibition rules: critical silences warning for same alert
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: ['alertname', 'namespace']

# =============================================================================
# GRAFANA
# =============================================================================
grafana:
  enabled: true

  adminPassword: '' # Managed via External Secrets

  # -- Grafana.ini overrides
  grafana.ini:
    server:
      root_url: 'https://grafana.{{ .Values.global.domain | default "example.com" }}'
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: false
    security:
      cookie_secure: true
      strict_transport_security: true
    analytics:
      reporting_enabled: false
      check_for_updates: false

  # -- Resources
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Persistence
  persistence:
    enabled: true
    storageClassName: gp3
    size: 10Gi

  # -- Sidecar for auto-loading dashboards from ConfigMaps
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
      folder: /tmp/dashboards
      folderAnnotation: grafana_folder
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: '1'

  # -- Default datasources
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy
      isDefault: false
      jsonData:
        derivedFields:
          - datasourceUid: tempo
            matcherRegex: "trace_id=(\\w+)"
            name: TraceID
            url: '$${__value.raw}'

    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false

  # -- Ingress via ALB
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: '${ACM_CERT_ARN}'
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
    hosts:
      - grafana.example.com
    tls:
      - hosts:
          - grafana.example.com

# =============================================================================
# KUBE-STATE-METRICS
# =============================================================================
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# =============================================================================
# NODE EXPORTER
# =============================================================================
nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# =============================================================================
# DEFAULT RULES (built-in alerts)
# =============================================================================
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false # EKS manages etcd
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: false # EKS managed
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false # EKS managed
    kubeSchedulerRecording: false # EKS managed
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# =============================================================================
# KUBELET & API SERVER (EKS specifics)
# =============================================================================
kubelet:
  enabled: true
  serviceMonitor:
    https: true

kubeApiServer:
  enabled: true

# Disable control-plane components (EKS managed)
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

# =============================================================================
# PROMETHEUS OPERATOR
# =============================================================================
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # -- Admission webhooks for PrometheusRule validation
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true

# =============================================================================
# GLOBAL OVERRIDES (per-environment via ArgoCD)
# =============================================================================
global:
  environment: dev
  domain: example.com
