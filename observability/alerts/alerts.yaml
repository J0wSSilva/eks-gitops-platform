# =============================================================================
# PrometheusRule - Custom Alerts for EKS GitOps Platform
# Applied via ArgoCD → kube-prometheus-stack picks up automatically
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: monitoring
    role: alert-rules
spec:
  groups:
    # =========================================================================
    # APPLICATION ALERTS (SLO-based)
    # =========================================================================
    - name: application.slo
      rules:
        # -- Availability SLO breach (99.9% over 5m window)
        - alert: HighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (namespace, service)
              /
              sum(rate(http_requests_total[5m])) by (namespace, service)
            ) > 0.001
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: 'High 5xx error rate on {{ $labels.service }}'
            description: |
              Service {{ $labels.service }} in namespace {{ $labels.namespace }}
              has error rate {{ $value | humanizePercentage }} (threshold: 0.1%).
              This breaches the 99.9% availability SLO.
            runbook_url: 'https://github.com/J0wSSilva/eks-gitops-platform/blob/main/docs/runbooks/high-error-rate.md'
            dashboard_url: 'https://grafana.example.com/d/app-metrics-red?var-namespace={{ $labels.namespace }}&var-service={{ $labels.service }}'

        # -- Latency SLO breach (p99 > 500ms)
        - alert: HighLatencyP99
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket[5m])) by (le, namespace, service)
            ) > 0.5
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'High p99 latency on {{ $labels.service }}'
            description: |
              Service {{ $labels.service }} p99 latency is {{ $value | humanizeDuration }}
              (threshold: 500ms). Investigate slow endpoints or database queries.
            runbook_url: 'https://github.com/J0wSSilva/eks-gitops-platform/blob/main/docs/runbooks/high-latency.md'

        # -- Latency SLO critical (p99 > 2s)
        - alert: CriticalLatencyP99
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket[5m])) by (le, namespace, service)
            ) > 2
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: 'Critical p99 latency on {{ $labels.service }}'
            description: |
              Service {{ $labels.service }} p99 latency is {{ $value | humanizeDuration }}.
              Users are experiencing severe degradation. Immediate action required.
            runbook_url: 'https://github.com/J0wSSilva/eks-gitops-platform/blob/main/docs/runbooks/high-latency.md'

        # -- Error budget burn rate (fast burn)
        - alert: ErrorBudgetFastBurn
          expr: |
            (
              sum(rate(http_requests_total{status_code=~"5.."}[1h])) by (namespace, service)
              /
              sum(rate(http_requests_total[1h])) by (namespace, service)
            ) > (14.4 * 0.001)
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: 'Error budget burning fast for {{ $labels.service }}'
            description: |
              Service {{ $labels.service }} is burning error budget 14.4x faster than normal.
              At this rate, the monthly budget will be exhausted in ~2 days.
            runbook_url: 'https://github.com/J0wSSilva/eks-gitops-platform/blob/main/docs/runbooks/error-budget.md'

    # =========================================================================
    # POD HEALTH ALERTS
    # =========================================================================
    - name: pod.health
      rules:
        # -- Pod CrashLoopBackOff
        - alert: PodCrashLooping
          expr: |
            max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping'
            description: |
              Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace: {{ $labels.namespace }})
              has been in CrashLoopBackOff for more than 5 minutes.
              Check logs: kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} -c {{ $labels.container }} --previous
            runbook_url: 'https://github.com/J0wSSilva/eks-gitops-platform/blob/main/docs/runbooks/crashloop.md'

        # -- Pod OOMKilled
        - alert: PodOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 0m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'Container {{ $labels.container }} OOMKilled in {{ $labels.namespace }}/{{ $labels.pod }}'
            description: |
              Container {{ $labels.container }} was OOMKilled. Current memory limit may be too low.
              Consider increasing resources.limits.memory in the deployment.
            runbook_url: 'https://github.com/J0wSSilva/eks-gitops-platform/blob/main/docs/runbooks/oomkilled.md'

        # -- Pod stuck in Pending
        - alert: PodPending
          expr: |
            sum by (namespace, pod) (kube_pod_status_phase{phase="Pending"}) > 0
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} stuck in Pending'
            description: |
              Pod has been Pending for 15+ minutes. Possible causes:
              - Insufficient cluster resources (check node autoscaler)
              - PVC not bound (check storage class)
              - Image pull error (check ECR permissions)
            runbook_url: 'https://github.com/J0wSSilva/eks-gitops-platform/blob/main/docs/runbooks/pod-pending.md'

        # -- High pod restart rate
        - alert: HighPodRestartRate
          expr: |
            increase(kube_pod_container_status_restarts_total[1h]) > 5
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'High restart rate for {{ $labels.namespace }}/{{ $labels.pod }}'
            description: |
              Pod {{ $labels.pod }} has restarted {{ $value | humanize }} times in the last hour.
              This indicates instability — check readiness probes, resource limits, and application logs.

        # -- Deployment replicas mismatch
        - alert: DeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas != kube_deployment_status_ready_replicas
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has replica mismatch'
            description: |
              Deployment {{ $labels.deployment }} has {{ $value }} desired replicas but not all are ready.
              Desired: {{ with printf `kube_deployment_spec_replicas{namespace="%s",deployment="%s"}` $labels.namespace $labels.deployment | query }}{{ . | first | value }}{{ end }}

    # =========================================================================
    # NODE ALERTS
    # =========================================================================
    - name: node.health
      rules:
        # -- Node not ready
        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: 'Node {{ $labels.node }} is NotReady'
            description: |
              Node {{ $labels.node }} has been in NotReady state for 5+ minutes.
              This impacts pod scheduling and may cause service degradation.
              Check: kubectl describe node {{ $labels.node }}
            runbook_url: 'https://github.com/J0wSSilva/eks-gitops-platform/blob/main/docs/runbooks/node-not-ready.md'

        # -- Node high CPU
        - alert: NodeHighCPU
          expr: |
            100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[10m])) * 100) > 85
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'Node {{ $labels.instance }} CPU usage above 85%'
            description: |
              Node CPU usage is {{ $value | humanize }}% for 15+ minutes.
              Consider scaling the node group or investigating CPU-heavy pods.

        # -- Node high memory
        - alert: NodeHighMemory
          expr: |
            100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 90
          for: 10m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: 'Node {{ $labels.instance }} memory usage above 90%'
            description: |
              Node memory usage is {{ $value | humanize }}%. OOMKiller may start killing pods.
              Scale the node group immediately or evict non-critical workloads.
            runbook_url: 'https://github.com/J0wSSilva/eks-gitops-platform/blob/main/docs/runbooks/node-memory.md'

        # -- Node disk pressure
        - alert: NodeDiskPressure
          expr: |
            100 - ((node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}) * 100) > 85
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'Node {{ $labels.instance }} disk usage above 85%'
            description: |
              Disk usage is {{ $value | humanize }}%. Clean up unused images/logs or expand the volume.
              Run: docker system prune -a --volumes (if applicable)

    # =========================================================================
    # ARGOCD ALERTS
    # =========================================================================
    - name: argocd.health
      rules:
        # -- ArgoCD app out of sync
        - alert: ArgoCDAppOutOfSync
          expr: |
            argocd_app_info{sync_status!="Synced"} == 1
          for: 30m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'ArgoCD app {{ $labels.name }} is out of sync'
            description: |
              Application {{ $labels.name }} (project: {{ $labels.project }}) has been out of sync for 30+ minutes.
              This means the live state differs from the desired state in Git.
              Check: argocd app diff {{ $labels.name }}

        # -- ArgoCD app degraded
        - alert: ArgoCDAppDegraded
          expr: |
            argocd_app_info{health_status="Degraded"} == 1
          for: 10m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: 'ArgoCD app {{ $labels.name }} is Degraded'
            description: |
              Application {{ $labels.name }} health is Degraded for 10+ minutes.
              One or more resources are unhealthy. Check ArgoCD UI for details.
            runbook_url: 'https://github.com/J0wSSilva/eks-gitops-platform/blob/main/docs/runbooks/argocd-degraded.md'

        # -- ArgoCD sync failed
        - alert: ArgoCDSyncFailed
          expr: |
            increase(argocd_app_sync_total{phase="Failed"}[10m]) > 0
          for: 0m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'ArgoCD sync failed for {{ $labels.name }}'
            description: |
              Application {{ $labels.name }} failed to sync. Check:
              - Kustomize/Helm rendering errors
              - Invalid YAML manifests
              - RBAC permission issues

    # =========================================================================
    # CERTIFICATE & SECRET ALERTS
    # =========================================================================
    - name: certificates.health
      rules:
        # -- Certificate expiring soon
        - alert: CertificateExpiringSoon
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 14
          for: 1h
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'Certificate {{ $labels.name }} expires in less than 14 days'
            description: |
              Certificate {{ $labels.name }} in namespace {{ $labels.namespace }}
              expires in {{ $value | humanize }} days. Check cert-manager logs for renewal issues.

        # -- External Secret sync failure
        - alert: ExternalSecretSyncFailed
          expr: |
            externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 10m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: 'ExternalSecret {{ $labels.name }} sync failed'
            description: |
              ExternalSecret {{ $labels.name }} in namespace {{ $labels.namespace }}
              has been failing to sync for 10+ minutes. Application may be using stale secrets.
              Check: kubectl describe externalsecret -n {{ $labels.namespace }} {{ $labels.name }}
            runbook_url: 'https://github.com/J0wSSilva/eks-gitops-platform/blob/main/docs/runbooks/external-secret-failed.md'

    # =========================================================================
    # RESOURCE QUOTA & HPA ALERTS
    # =========================================================================
    - name: capacity.planning
      rules:
        # -- HPA at max replicas
        - alert: HPAAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
          for: 30m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} at max replicas'
            description: |
              HPA has been at maximum replicas ({{ $value }}) for 30+ minutes.
              The application may need more capacity. Consider increasing maxReplicas.

        # -- PVC almost full
        - alert: PVCAlmostFull
          expr: |
            (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.85
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is 85%+ full'
            description: |
              PVC usage is {{ $value | humanizePercentage }}. Expand the volume or clean up data
              before it fills completely and causes application failures.
