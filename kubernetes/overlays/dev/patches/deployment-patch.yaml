# =============================================================================
# Dev Patch - Deployment
# Menos replicas, resources baixos, imagem com tag dev
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: demo-app
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          env:
            - name: ENVIRONMENT
              value: 'dev'
            - name: LOG_LEVEL
              value: 'debug'
