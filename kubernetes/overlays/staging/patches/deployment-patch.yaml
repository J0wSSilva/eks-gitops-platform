# =============================================================================
# Staging Patch - Deployment
# 2 replicas, resources médios, simula prod
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: demo-app
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: ENVIRONMENT
              value: 'staging'
            - name: LOG_LEVEL
              value: 'info'
