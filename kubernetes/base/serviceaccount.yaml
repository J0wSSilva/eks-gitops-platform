# =============================================================================
# ServiceAccount com IRSA (IAM Roles for Service Accounts)
# O annotation mapeia este SA para uma IAM role na AWS
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  annotations:
    # Preencher com o ARN da IAM role criada para o app
    # Permite que o pod assuma a role sem precisar de access keys
    eks.amazonaws.com/role-arn: 'arn:aws:iam::ACCOUNT_ID:role/eks-gitops-demo-app-role'
