# =============================================================================
# Terraform Pipeline - Format → Validate → Plan → Apply
#
# Triggers:
#   - PR com changes em terraform/ → plan only (comenta no PR)
#   - Push em main com changes em terraform/ → plan + apply
#   - Manual dispatch (escolhe environment)
#
# Secrets necessários:
#   - AWS_ACCOUNT_ID
#   - AWS_REGION
# =============================================================================
name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

concurrency:
  group: terraform-${{ github.event.inputs.environment || 'all' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: '1.7.5'
  TF_INPUT: 'false'
  TF_IN_AUTOMATION: 'true'

jobs:
  # ===========================================================================
  # Detecta quais environments mudaram
  # ===========================================================================
  detect-changes:
    name: '🔍 Detect Changes'
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.changes.outputs.dev }}
      staging: ${{ steps.changes.outputs.staging }}
      prod: ${{ steps.changes.outputs.prod }}
      modules: ${{ steps.changes.outputs.modules }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            dev:
              - 'terraform/environments/dev/**'
              - 'terraform/modules/**'
            staging:
              - 'terraform/environments/staging/**'
              - 'terraform/modules/**'
            prod:
              - 'terraform/environments/prod/**'
              - 'terraform/modules/**'
            modules:
              - 'terraform/modules/**'

  # ===========================================================================
  # Terraform Plan/Apply - Matrix por environment
  # ===========================================================================
  terraform:
    name: '🏗️ Terraform (${{ matrix.environment }})'
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.dev == 'true' ||
      needs.detect-changes.outputs.staging == 'true' ||
      needs.detect-changes.outputs.prod == 'true'

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - staging
          - prod
        exclude:
          # Em PRs e pushes, exclui environments que não mudaram
          - environment: ${{ needs.detect-changes.outputs.dev != 'true' && github.event_name != 'workflow_dispatch' && 'dev' || 'SKIP' }}
          - environment: ${{ needs.detect-changes.outputs.staging != 'true' && github.event_name != 'workflow_dispatch' && 'staging' || 'SKIP' }}
          - environment: ${{ needs.detect-changes.outputs.prod != 'true' && github.event_name != 'workflow_dispatch' && 'prod' || 'SKIP' }}

    environment:
      name: ${{ matrix.environment }}-infra

    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -no-color

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan \
            -detailed-exitcode 2>&1 | tee plan_output.txt
        continue-on-error: true

      # Comenta o plan no PR
      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/${{ matrix.environment }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n\n... (truncated)' : plan;

            const body = `### 🏗️ Terraform Plan — \`${{ matrix.environment }}\`

            | Step | Status |
            |------|--------|
            | Format | ${{ steps.fmt.outcome == 'success' && '✅' || '⚠️' }} |
            | Init | ${{ steps.init.outcome == 'success' && '✅' || '❌' }} |
            | Validate | ${{ steps.validate.outcome == 'success' && '✅' || '❌' }} |
            | Plan | ${{ steps.plan.outcome == 'success' && '✅' || '⚠️' }} |

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      # Apply apenas em push para main ou workflow_dispatch com action=apply
      - name: Terraform Apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
        run: terraform apply -no-color tfplan

      # Destroy (apenas via workflow_dispatch manual)
      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -no-color -auto-approve

      - name: Terraform Summary
        if: always()
        run: |
          echo "## 🏗️ Terraform — ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Format | ${{ steps.fmt.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Init | ${{ steps.init.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validate | ${{ steps.validate.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Plan | ${{ steps.plan.outcome }} |" >> $GITHUB_STEP_SUMMARY
