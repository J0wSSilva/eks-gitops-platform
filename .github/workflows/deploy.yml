# =============================================================================
# Deploy Pipeline - GitOps (atualiza image tag no Kustomize overlay)
#
# Fluxo:
#   CI conclui → deploy.yml dispara → atualiza tag no overlay → commit → push
#   → ArgoCD detecta o diff → sincroniza automaticamente (dev/staging)
#   → prod requer approval manual
#
# GitHub Environments necessários:
#   - dev (auto-deploy)
#   - staging (auto-deploy)
#   - prod (required reviewers + wait timer)
# =============================================================================
name: Deploy

on:
  workflow_run:
    workflows: ['CI Pipeline']
    types: [completed]
    branches: [main]

  # Deploy manual (útil para rollback ou re-deploy)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: 'Image tag to deploy (ex: sha-abc1234, v1.2.3)'
        required: true
        type: string

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'progressive' }}
  cancel-in-progress: false # Nunca cancela deploys em andamento

permissions:
  contents: write # Para commit no repo
  id-token: write # OIDC

env:
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION || 'us-east-1' }}.amazonaws.com
  ECR_REPOSITORY: eks-gitops-platform/demo-app

jobs:
  # ===========================================================================
  # Determina a tag da imagem (do CI ou do input manual)
  # ===========================================================================
  prepare:
    name: '📋 Prepare'
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
      short_sha: ${{ steps.tag.outputs.short_sha }}

    steps:
      - name: Determine image tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "short_sha=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
            echo "value=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

  # ===========================================================================
  # Deploy Dev (automático)
  # ===========================================================================
  deploy-dev:
    name: '🚀 Deploy Dev'
    runs-on: ubuntu-latest
    needs: prepare
    environment:
      name: dev
      url: https://app-dev.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Update image tag in dev overlay
        run: |
          cd kubernetes/overlays/dev
          kustomize edit set image \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.prepare.outputs.image_tag }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/overlays/dev/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "deploy(dev): update image to ${{ needs.prepare.outputs.image_tag }}"
          git push

      - name: Deploy Summary
        run: |
          echo "## 🚀 Deploy to Dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | dev |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ needs.prepare.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ArgoCD** | Auto-sync enabled |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Deploy Staging (automático após dev)
  # ===========================================================================
  deploy-staging:
    name: '🚀 Deploy Staging'
    runs-on: ubuntu-latest
    needs: [prepare, deploy-dev]
    environment:
      name: staging
      url: https://app-staging.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main # Pega o commit mais recente (inclui o commit do dev)

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Update image tag in staging overlay
        run: |
          cd kubernetes/overlays/staging
          kustomize edit set image \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.prepare.outputs.image_tag }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/overlays/staging/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "deploy(staging): update image to ${{ needs.prepare.outputs.image_tag }}"
          git push

      - name: Deploy Summary
        run: |
          echo "## 🚀 Deploy to Staging" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | staging |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ needs.prepare.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ArgoCD** | Auto-sync enabled |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Deploy Prod (requer aprovação manual via GitHub Environment)
  # ===========================================================================
  deploy-prod:
    name: '🚀 Deploy Prod'
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    environment:
      name: prod
      url: https://app.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Update image tag in prod overlay
        run: |
          cd kubernetes/overlays/prod
          kustomize edit set image \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.prepare.outputs.image_tag }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/overlays/prod/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "deploy(prod): update image to ${{ needs.prepare.outputs.image_tag }} [approved]"
          git push

      - name: Deploy Summary
        run: |
          echo "## 🚀 Deploy to Prod" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | prod |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ needs.prepare.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ArgoCD** | Manual sync required |" >> $GITHUB_STEP_SUMMARY
          echo "| **Approved by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
